# Managed by AI SDLC. Runs the project's SonarQube scan. The token is a
# repository secret (SONAR_TOKEN), written by the platform or added by the user;
# it is never committed here. Actions are pinned to a commit, not a movable tag.
name: SonarQube scan

on:
  workflow_dispatch: {}
  push:
    branches-ignore:
      - "main"
    paths:
      - ".quorq/sonar/request"

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402  # v4.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Print the scanner's report-task.txt so the backend can read the ceTaskId
      # from the job log and wait for Sonar to finish before it reads the measures.
      - name: Report analysis task
        if: always()
        shell: bash
        run: cat .scannerwork/report-task.txt || true
